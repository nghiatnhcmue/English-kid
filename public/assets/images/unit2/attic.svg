<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="atticBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.3" />
    </radialGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <filter id="aShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.2" flood-color="#451A03" />
    </filter>
  </defs>

  <circle cx="100" cy="100" r="94" fill="url(#atticBg)" />

  <g filter="url(#aShadow)">
    <!-- Attic Triangular Room Interior -->
    <!-- Back Wall -->
    <polygon points="100,32 170,145 30,145" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2" />
    
    <!-- Wooden Floor Boards -->
    <polygon points="30,145 170,145 175,170 25,170" fill="#D97706" stroke="#92400E" stroke-width="1.5" />
    <line x1="60" y1="145" x2="55" y2="170" stroke="#B45309" stroke-width="1.2" />
    <line x1="95" y1="145" x2="95" y2="170" stroke="#B45309" stroke-width="1.2" />
    <line x1="135" y1="145" x2="140" y2="170" stroke="#B45309" stroke-width="1.2" />

    <!-- Slanted Roof Beams (Left & Right) -->
    <!-- Left Rafter Beam -->
    <polygon points="98,22 102,28 32,148 24,142" fill="url(#beamGrad)" stroke="#451A03" stroke-width="1.2" />
    <!-- Right Rafter Beam -->
    <polygon points="102,22 98,28 168,148 176,142" fill="url(#beamGrad)" stroke="#451A03" stroke-width="1.2" />
    <!-- Center horizontal tie collar beam -->
    <rect x="58" y="74" width="84" height="8" rx="2" fill="url(#beamGrad)" stroke="#451A03" stroke-width="1" />

    <!-- Round Attic Dormer Window with Sunlight -->
    <circle cx="100" cy="56" r="16" fill="url(#skyGrad)" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="100" y1="40" x2="100" y2="72" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="84" y1="56" x2="116" y2="56" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Sunlight ray angle -->
    <polygon points="90,70 110,70 145,145 75,145" fill="#FEF08A" opacity="0.3" />

    <!-- Wooden Storage Box / Trunk in attic -->
    <rect x="110" y="120" width="38" height="25" rx="3" fill="#B45309" stroke="#78350F" stroke-width="1.2" />
    <!-- Metal straps on box -->
    <line x1="118" y1="120" x2="118" y2="145" stroke="#FDE047" stroke-width="1.5" />
    <line x1="140" y1="120" x2="140" y2="145" stroke="#FDE047" stroke-width="1.5" />
    <circle cx="129" cy="132" r="2.5" fill="#FEF08A" />

    <!-- Wooden Ladder leading up into attic -->
    <g transform="rotate(12 60 135)">
      <line x1="50" y1="95" x2="50" y2="160" stroke="#92400E" stroke-width="3.5" stroke-linecap="round" />
      <line x1="66" y1="95" x2="66" y2="160" stroke="#92400E" stroke-width="3.5" stroke-linecap="round" />
      <line x1="50" y1="108" x2="66" y2="108" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" />
      <line x1="50" y1="122" x2="66" y2="122" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" />
      <line x1="50" y1="136" x2="66" y2="136" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" />
      <line x1="50" y1="150" x2="66" y2="150" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
</svg>