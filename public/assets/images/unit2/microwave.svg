<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="microBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFEDD5" stop-opacity="0.4" />
    </radialGradient>
    <linearGradient id="microBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.6" />
    </linearGradient>
    <filter id="mShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity="0.2" flood-color="#0F172A" />
    </filter>
  </defs>

  <circle cx="100" cy="100" r="94" fill="url(#microBg)" />

  <g filter="url(#mShadow)">
    <!-- Microwave rubber feet -->
    <rect x="42" y="148" width="12" height="6" rx="2" fill="#334155" />
    <rect x="146" y="148" width="12" height="6" rx="2" fill="#334155" />

    <!-- Main Outer Body -->
    <rect x="32" y="46" width="136" height="104" rx="12" fill="url(#microBody)" stroke="#64748B" stroke-width="2" />

    <!-- Glass Viewing Door -->
    <rect x="38" y="52" width="90" height="92" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <!-- Glass inner chamber window with warm heating glow -->
    <rect x="44" y="58" width="78" height="80" rx="5" fill="#451A03" />
    <rect x="44" y="58" width="78" height="80" rx="5" fill="url(#warmLight)" opacity="0.4" />
    
    <!-- Rotating turntable glass plate inside -->
    <ellipse cx="83" cy="124" rx="30" ry="6" fill="#F1F5F9" opacity="0.8" />
    <!-- Heated soup bowl with steam inside -->
    <path d="M 71 114 Q 83 128 95 114 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="1" />
    <path d="M 80 106 Q 83 100 80 94" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 86 108 Q 89 102 86 96" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round" />

    <!-- Microwave Door Vertical Handle -->
    <rect x="122" y="66" width="5" height="64" rx="2.5" fill="#CBD5E1" stroke="#64748B" stroke-width="0.8" />

    <!-- Right Side Electronic Control Panel -->
    <rect x="134" y="52" width="30" height="92" rx="6" fill="#0F172A" />
    <!-- Digital Green LED Clock Timer -->
    <rect x="137" y="58" width="24" height="15" rx="3" fill="#022C22" stroke="#064E3B" stroke-width="0.8" />
    <text x="149" y="70" font-family="monospace" font-size="9" font-weight="900" fill="#22C55E" text-anchor="middle">01:30</text>

    <!-- Keypad buttons -->
    <rect x="138" y="78" width="10" height="6" rx="1.5" fill="#334155" />
    <rect x="151" y="78" width="10" height="6" rx="1.5" fill="#334155" />
    <rect x="138" y="87" width="10" height="6" rx="1.5" fill="#334155" />
    <rect x="151" y="87" width="10" height="6" rx="1.5" fill="#334155" />

    <!-- Rotary dial / Start knob -->
    <circle cx="149" cy="112" r="9" fill="#E2E8F0" stroke="#64748B" stroke-width="1.2" />
    <line x1="149" y1="104" x2="149" y2="108" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Big Start button (Green) and Stop (Red) -->
    <rect x="138" y="128" width="10" height="8" rx="2" fill="#EF4444" />
    <rect x="151" y="128" width="10" height="8" rx="2" fill="#22C55E" />
  </g>
</svg>
