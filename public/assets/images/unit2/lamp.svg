<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="lampBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="100%" stop-color="#FEF9C3" stop-opacity="0.4" />
    </radialGradient>
    <linearGradient id="lampYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="lightCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.05" />
    </linearGradient>
    <filter id="lShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity="0.2" flood-color="#78350F" />
    </filter>
  </defs>

  <circle cx="100" cy="100" r="94" fill="url(#lampBg)" />

  <!-- Warm light cone cast by lamp onto desk -->
  <polygon points="68,82 25,170 120,170" fill="url(#lightCone)" />

  <g filter="url(#lShadow)">
    <!-- Heavy base on desk -->
    <ellipse cx="135" cy="165" rx="32" ry="10" fill="url(#lampYellow)" stroke="#B45309" stroke-width="1.5" />
    <!-- Rocker Power Switch on base -->
    <rect x="130" y="158" width="10" height="6" rx="2" fill="#EF4444" stroke="#991B1B" stroke-width="0.8" />

    <!-- Articulated metal arm joints -->
    <!-- Lower joint -->
    <circle cx="145" cy="160" r="5" fill="#CBD5E1" stroke="#64748B" stroke-width="1.2" />
    <!-- Lower arm rod -->
    <line x1="145" y1="160" x2="125" y2="105" stroke="#475569" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Middle elbow joint with thumb screw -->
    <circle cx="125" cy="105" r="6" fill="#CBD5E1" stroke="#64748B" stroke-width="1.2" />
    <circle cx="125" cy="105" r="2.5" fill="#475569" />

    <!-- Upper arm rod reaching out -->
    <line x1="125" y1="105" x2="80" y2="65" stroke="#475569" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="80" cy="65" r="5" fill="#CBD5E1" stroke="#64748B" stroke-width="1.2" />

    <!-- Conical Bell Lampshade angled down towards left -->
    <g transform="rotate(35 80 65)">
      <!-- Socket cap -->
      <path d="M 66 52 L 94 52 L 90 64 L 70 64 Z" fill="#92400E" />
      <!-- Main Lampshade Cone -->
      <path d="M 70 64 L 90 64 L 110 96 L 50 96 Z" fill="url(#lampYellow)" stroke="#B45309" stroke-width="1.5" />
      <!-- Glowing light bulb rim inside shade -->
      <ellipse cx="80" cy="96" rx="30" ry="8" fill="#FEF08A" stroke="#FDE047" stroke-width="1.2" />
      <circle cx="80" cy="94" r="6" fill="#FFFFFF" />
    </g>
  </g>
</svg>