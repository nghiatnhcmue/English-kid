<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="fridgeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.4" />
    </radialGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <filter id="fShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="7" stdDeviation="4" flood-opacity="0.2" flood-color="#0F172A" />
    </filter>
  </defs>

  <circle cx="100" cy="100" r="94" fill="url(#fridgeBg)" />

  <g filter="url(#fShadow)">
    <!-- Base feet -->
    <rect x="58" y="174" width="12" height="6" rx="2" fill="#334155" />
    <rect x="130" y="174" width="12" height="6" rx="2" fill="#334155" />

    <!-- Main Cabinet Casing -->
    <rect x="50" y="20" width="100" height="156" rx="12" fill="#94A3B8" stroke="#475569" stroke-width="2" />

    <!-- Upper Freezer Door -->
    <rect x="52" y="22" width="96" height="52" rx="8" fill="url(#doorGrad)" stroke="#64748B" stroke-width="1.2" />
    <!-- Ice dispenser / temp indicator screen -->
    <rect x="62" y="36" width="22" height="18" rx="3" fill="#0F172A" />
    <text x="73" y="48" font-family="monospace" font-size="7" font-weight="900" fill="#38BDF8" text-anchor="middle">-18°C</text>
    <!-- Upper Door Handle -->
    <rect x="136" y="32" width="5" height="32" rx="2.5" fill="url(#handleGrad)" stroke="#64748B" stroke-width="0.8" />

    <!-- Cute little magnet on freezer -->
    <circle cx="105" cy="40" r="5" fill="#EF4444" /> <!-- Red apple magnet -->
    <path d="M 105 35 Q 107 33 109 35" stroke="#15803D" stroke-width="1.2" fill="none" />

    <!-- Lower Refrigerator Door -->
    <rect x="52" y="78" width="96" height="96" rx="8" fill="url(#doorGrad)" stroke="#64748B" stroke-width="1.2" />
    <!-- Lower Door Handle -->
    <rect x="136" y="90" width="5" height="55" rx="2.5" fill="url(#handleGrad)" stroke="#64748B" stroke-width="0.8" />

    <!-- Sticky note paper on lower door -->
    <rect x="64" y="96" width="24" height="26" rx="2" fill="#FEF08A" stroke="#FDE047" stroke-width="0.8" transform="rotate(-6 76 109)" />
    <line x1="68" y1="102" x2="84" y2="102" stroke="#CA8A04" stroke-width="1" transform="rotate(-6 76 109)" />
    <line x1="68" y1="108" x2="80" y2="108" stroke="#CA8A04" stroke-width="1" transform="rotate(-6 76 109)" />
    <circle cx="76" cy="94" r="2.5" fill="#3B82F6" /> <!-- Blue push pin -->
  </g>
</svg>