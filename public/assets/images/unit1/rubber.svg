<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="rubberBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDF2F8" />
      <stop offset="100%" stop-color="#FCE7F3" stop-opacity="0.4" />
    </radialGradient>
    <linearGradient id="sleeveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="rubberWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="rubberPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <filter id="rShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity="0.2" flood-color="#0F172A" />
    </filter>
  </defs>

  <circle cx="100" cy="100" r="94" fill="url(#rubberBg)" />

  <g filter="url(#rShadow)" transform="rotate(-18 100 100)">
    <!-- White rubber exposed top/left block -->
    <path d="M 45 75 L 85 45 L 115 65 L 75 95 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 45 75 L 75 95 L 75 125 L 45 105 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
    
    <!-- Paper sleeve main body wrapping the eraser -->
    <path d="M 75 95 L 115 65 L 155 95 L 115 125 Z" fill="url(#sleeveGrad)" stroke="#1E40AF" stroke-width="1.5" />
    <path d="M 75 95 L 115 125 L 115 155 L 75 125 Z" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5" />
    <path d="M 115 125 L 155 95 L 155 125 L 115 155 Z" fill="#1E3A8A" stroke="#1E40AF" stroke-width="1.5" />

    <!-- Sleeve decoration & typography -->
    <path d="M 85 105 L 115 127 L 115 137 L 85 115 Z" fill="#60A5FA" opacity="0.6" />
    <rect x="88" y="78" width="50" height="18" rx="3" fill="#FFFFFF" transform="rotate(-20 113 87)" />
    <text x="113" y="90" font-family="sans-serif" font-size="7.5" font-weight="900" fill="#1E40AF" text-anchor="middle" transform="rotate(-20 113 90)" letter-spacing="1">ERASER</text>

    <!-- Cute star badge on sleeve -->
    <polygon points="98,135 100,130 102,135 107,135 103,138 105,143 100,140 95,143 97,138 93,135" fill="#FBBF24" />
  </g>

  <!-- Little eraser crumbs on the desk -->
  <circle cx="52" cy="155" r="3" fill="#94A3B8" opacity="0.6" />
  <circle cx="62" cy="162" r="2" fill="#CBD5E1" />
  <circle cx="70" cy="158" r="2.5" fill="#94A3B8" opacity="0.7" />
  <circle cx="150" cy="145" r="2.5" fill="#CBD5E1" />
</svg>
