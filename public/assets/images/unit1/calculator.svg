<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background subtle disc -->
    <radialGradient id="calcBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.4" />
    </radialGradient>
    <!-- Body Gradient: Modern sleek dark teal/navy blue -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <!-- LCD Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D1FAE5" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
    <!-- Solar panel gradient -->
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="50%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <!-- Button gradients -->
    <linearGradient id="numBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="opBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="equalBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="onBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="calcShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="4" flood-opacity="0.25" flood-color="#0F172A" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="94" fill="url(#calcBg)" />

  <!-- Main Calculator Body -->
  <g filter="url(#calcShadow)">
    <!-- Chassis -->
    <rect x="42" y="16" width="116" height="168" rx="18" fill="url(#bodyGrad)" stroke="#475569" stroke-width="2" />
    <rect x="44" y="18" width="112" height="164" rx="16" fill="none" stroke="#64748B" stroke-width="1" opacity="0.6" />

    <!-- Top Solar Cell & Brand Bar -->
    <rect x="54" y="28" width="46" height="10" rx="3" fill="#0F172A" />
    <text x="56" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="900" fill="#94A3B8" letter-spacing="1">CASIO</text>
    <rect x="106" y="28" width="40" height="10" rx="2" fill="url(#solarGrad)" stroke="#92400E" stroke-width="0.8" />
    <line x1="119" y1="28" x2="119" y2="38" stroke="#B45309" stroke-width="0.8" />
    <line x1="132" y1="28" x2="132" y2="38" stroke="#B45309" stroke-width="0.8" />

    <!-- LCD Display Screen Frame -->
    <rect x="52" y="44" width="96" height="30" rx="6" fill="#022C22" stroke="#064E3B" stroke-width="1.5" />
    <rect x="54" y="46" width="92" height="26" rx="4" fill="url(#screenGrad)" />
    <!-- Screen Glass Highlight Glare -->
    <polygon points="56,48 95,48 75,70 56,70" fill="#FFFFFF" opacity="0.25" />
    <!-- Digital Output Numbers -->
    <text x="142" y="66" font-family="'Courier New', monospace, monospace" font-size="16" font-weight="900" fill="#064E3B" text-anchor="end" letter-spacing="2">12345</text>
    <text x="57" y="54" font-family="sans-serif" font-size="6" font-weight="bold" fill="#047857">DEG</text>

    <!-- Function Key Row -->
    <rect x="54" y="82" width="18" height="10" rx="3" fill="#475569" />
    <text x="63" y="89" font-family="sans-serif" font-size="6" font-weight="bold" fill="#F8FAFC" text-anchor="middle">SHIFT</text>
    <rect x="78" y="82" width="18" height="10" rx="3" fill="#475569" />
    <text x="87" y="89" font-family="sans-serif" font-size="6" font-weight="bold" fill="#F8FAFC" text-anchor="middle">ALPHA</text>
    <rect x="102" y="82" width="18" height="10" rx="3" fill="#475569" />
    <text x="111" y="89" font-family="sans-serif" font-size="6" font-weight="bold" fill="#F8FAFC" text-anchor="middle">MODE</text>
    <rect x="126" y="82" width="20" height="10" rx="3" fill="url(#onBtn)" />
    <text x="136" y="89" font-family="sans-serif" font-size="6" font-weight="900" fill="#FFFFFF" text-anchor="middle">ON</text>

    <!-- Main Keypad Grid (Numbers 7, 8, 9, ÷, DEL) -->
    <!-- Row 1: 7 8 9 ÷ AC -->
    <rect x="54" y="99" width="18" height="12" rx="3" fill="url(#numBtn)" />
    <text x="63" y="108" font-family="sans-serif" font-size="9" font-weight="900" fill="#1E293B" text-anchor="middle">7</text>
    <rect x="78" y="99" width="18" height="12" rx="3" fill="url(#numBtn)" />
    <text x="87" y="108" font-family="sans-serif" font-size="9" font-weight="900" fill="#1E293B" text-anchor="middle">8</text>
    <rect x="102" y="99" width="18" height="12" rx="3" fill="url(#numBtn)" />
    <text x="111" y="108" font-family="sans-serif" font-size="9" font-weight="900" fill="#1E293B" text-anchor="middle">9</text>
    <rect x="126" y="99" width="20" height="12" rx="3" fill="url(#opBtn)" />
    <text x="136" y="108" font-family="sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">÷</text>

    <!-- Row 2: 4 5 6 × DEL -->
    <rect x="54" y="116" width="18" height="12" rx="3" fill="url(#numBtn)" />
    <text x="63" y="125" font-family="sans-serif" font-size="9" font-weight="900" fill="#1E293B" text-anchor="middle">4</text>
    <rect x="78" y="116" width="18" height="12" rx="3" fill="url(#numBtn)" />
    <text x="87" y="125" font-family="sans-serif" font-size="9" font-weight="900" fill="#1E293B" text-anchor="middle">5</text>
    <rect x="102" y="116" width="18" height="12" rx="3" fill="url(#numBtn)" />
    <text x="111" y="125" font-family="sans-serif" font-size="9" font-weight="900" fill="#1E293B" text-anchor="middle">6</text>
    <rect x="126" y="116" width="20" height="12" rx="3" fill="url(#opBtn)" />
    <text x="136" y="125" font-family="sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">×</text>

    <!-- Row 3: 1 2 3 - + -->
    <rect x="54" y="133" width="18" height="12" rx="3" fill="url(#numBtn)" />
    <text x="63" y="142" font-family="sans-serif" font-size="9" font-weight="900" fill="#1E293B" text-anchor="middle">1</text>
    <rect x="78" y="133" width="18" height="12" rx="3" fill="url(#numBtn)" />
    <text x="87" y="142" font-family="sans-serif" font-size="9" font-weight="900" fill="#1E293B" text-anchor="middle">2</text>
    <rect x="102" y="133" width="18" height="12" rx="3" fill="url(#numBtn)" />
    <text x="111" y="142" font-family="sans-serif" font-size="9" font-weight="900" fill="#1E293B" text-anchor="middle">3</text>
    <rect x="126" y="133" width="20" height="12" rx="3" fill="url(#opBtn)" />
    <text x="136" y="142" font-family="sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">−</text>

    <!-- Row 4: 0 . + = -->
    <rect x="54" y="150" width="18" height="12" rx="3" fill="url(#numBtn)" />
    <text x="63" y="159" font-family="sans-serif" font-size="9" font-weight="900" fill="#1E293B" text-anchor="middle">0</text>
    <rect x="78" y="150" width="18" height="12" rx="3" fill="url(#numBtn)" />
    <text x="87" y="158" font-family="sans-serif" font-size="10" font-weight="900" fill="#1E293B" text-anchor="middle">•</text>
    <rect x="102" y="150" width="18" height="12" rx="3" fill="url(#opBtn)" />
    <text x="111" y="159" font-family="sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">+</text>
    <rect x="126" y="150" width="20" height="12" rx="3" fill="url(#equalBtn)" />
    <text x="136" y="159" font-family="sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">=</text>
  </g>
</svg>