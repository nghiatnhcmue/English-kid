<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Circle subtle glow -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F4FD" />
      <stop offset="100%" stop-color="#D1E9FA" stop-opacity="0.4" />
    </radialGradient>
    <!-- Metallic Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="30%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="metalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="pencilYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="3" flood-opacity="0.18" flood-color="#0F172A" />
    </filter>
  </defs>

  <!-- Background disc -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" />

  <!-- Dotted geometric arc drawn by the compass -->
  <path d="M 50 165 A 75 75 0 0 1 150 162" fill="none" stroke="#0284C7" stroke-width="3" stroke-dasharray="6,6" stroke-linecap="round" opacity="0.75" />
  <circle cx="50" cy="165" r="3.5" fill="#DC2626" /> <!-- Needle center mark -->

  <!-- Group with drop shadow -->
  <g filter="url(#shadow)">
    <!-- Top cylindrical handle (knob) -->
    <rect x="95" y="16" width="10" height="22" rx="4" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5" />
    <line x1="97" y1="21" x2="103" y2="21" stroke="#64748B" stroke-width="1.5" />
    <line x1="97" y1="26" x2="103" y2="26" stroke="#64748B" stroke-width="1.5" />
    <line x1="97" y1="31" x2="103" y2="31" stroke="#64748B" stroke-width="1.5" />

    <!-- Central hinge joint -->
    <circle cx="100" cy="46" r="14" fill="url(#metalBlue)" stroke="#0369A1" stroke-width="2" />
    <circle cx="100" cy="46" r="7" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" />
    <circle cx="100" cy="46" r="2.5" fill="#0284C7" />

    <!-- LEFT LEG (Needle leg) -->
    <!-- Upper leg arm -->
    <path d="M 94 54 L 62 135 L 68 136 L 98 55 Z" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.2" />
    <!-- Needle holder joint -->
    <rect x="58" y="132" width="12" height="10" rx="2" fill="url(#metalBlue)" stroke="#0369A1" stroke-width="1" transform="rotate(22 64 137)" />
    <!-- Sharp steel needle tip -->
    <polygon points="63,142 66,143 51,166 49,165" fill="#475569" />
    <polygon points="50,165 49,166 52,165" fill="#0F172A" />

    <!-- RIGHT LEG (Pencil holder leg) -->
    <!-- Upper leg arm -->
    <path d="M 102 55 L 132 120 L 138 118 L 106 54 Z" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.2" />
    <!-- Pencil clamp ring -->
    <rect x="126" y="115" width="18" height="14" rx="3" fill="url(#metalBlue)" stroke="#0369A1" stroke-width="1.5" transform="rotate(-25 135 122)" />
    <!-- Tightening thumb screw -->
    <rect x="144" y="112" width="8" height="6" rx="2" fill="url(#metalGrad)" stroke="#475569" stroke-width="1" transform="rotate(-25 148 115)" />

    <!-- Inserted Pencil -->
    <g transform="rotate(-24 135 130)">
      <!-- Pencil Body (Yellow) -->
      <polygon points="131,85 139,85 139,136 131,136" fill="url(#pencilYellow)" stroke="#CA8A04" stroke-width="1" />
      <!-- Pencil stripes -->
      <line x1="135" y1="85" x2="135" y2="136" stroke="#FEF08A" stroke-width="1" />
      <!-- Pink Eraser & Silver ferrule -->
      <rect x="131" y="80" width="8" height="6" fill="#CBD5E1" stroke="#94A3B8" stroke-width="0.8" />
      <rect x="131" y="72" width="8" height="8" rx="2" fill="#F472B6" />
      <!-- Wooden sharpened cone -->
      <polygon points="131,136 139,136 135,152" fill="#FED7AA" stroke="#FDBA74" stroke-width="0.8" />
      <!-- Graphite lead tip -->
      <polygon points="133.5,147 136.5,147 135,153" fill="#1E293B" />
    </g>
  </g>

  <!-- Little sparkle indicator -->
  <path d="M 152 154 L 154 148 L 156 154 L 162 156 L 156 158 L 154 164 L 152 158 L 146 156 Z" fill="#F59E0B" />
</svg>
