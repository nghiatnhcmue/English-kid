<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="caseBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0.5" />
    </radialGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="caseShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity="0.2" flood-color="#1E1B4B" />
    </filter>
  </defs>

  <circle cx="100" cy="100" r="94" fill="url(#caseBg)" />

  <g filter="url(#caseShadow)">
    <!-- Peeking stationery items inside pouch -->
    <!-- Yellow Pencil peeking -->
    <rect x="68" y="45" width="12" height="45" rx="2" fill="#FBBF24" stroke="#D97706" stroke-width="1.2" transform="rotate(-15 74 65)" />
    <polygon points="68,45 80,45 74,30" fill="#FED7AA" stroke="#D97706" stroke-width="1.2" transform="rotate(-15 74 65)" />
    <polygon points="72,35 76,35 74,30" fill="#1E293B" transform="rotate(-15 74 65)" />

    <!-- Red Pen peeking -->
    <rect x="94" y="40" width="10" height="50" rx="3" fill="#EF4444" stroke="#B91C1C" stroke-width="1.2" transform="rotate(8 99 65)" />
    <rect x="92" y="55" width="4" height="20" rx="1.5" fill="#CBD5E1" transform="rotate(8 99 65)" /> <!-- Pen clip -->

    <!-- Green Ruler peeking -->
    <rect x="118" y="38" width="16" height="55" rx="2" fill="#34D399" stroke="#059669" stroke-width="1.2" transform="rotate(22 126 65)" />
    <!-- Ruler scale marks -->
    <line x1="120" y1="46" x2="128" y2="46" stroke="#064E3B" stroke-width="1" transform="rotate(22 126 65)" />
    <line x1="120" y1="52" x2="125" y2="52" stroke="#064E3B" stroke-width="1" transform="rotate(22 126 65)" />
    <line x1="120" y1="58" x2="128" y2="58" stroke="#064E3B" stroke-width="1" transform="rotate(22 126 65)" />
    <line x1="120" y1="64" x2="125" y2="64" stroke="#064E3B" stroke-width="1" transform="rotate(22 126 65)" />

    <!-- Main Pouch Body -->
    <path d="M 32 95 Q 100 80 168 95 C 178 115 178 140 165 152 C 150 162 50 162 35 152 C 22 140 22 115 32 95 Z" fill="url(#pouchGrad)" stroke="#3730A3" stroke-width="2" />

    <!-- Front decorative pocket / stripe -->
    <path d="M 36 122 Q 100 114 164 122 C 160 148 40 148 36 122 Z" fill="#4338CA" opacity="0.6" />
    <circle cx="100" cy="136" r="10" fill="#FDE047" />
    <polygon points="100,129 102,134 107,134 103,137 105,142 100,139 95,142 97,137 93,134 98,134" fill="#D97706" />

    <!-- Metal Zipper Track & Teeth along top curve -->
    <path d="M 34 95 Q 100 82 166 95" fill="none" stroke="#FDE047" stroke-width="4" stroke-linecap="round" />
    <path d="M 34 95 Q 100 82 166 95" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Zipper slider & cute pull tab -->
    <rect x="62" y="86" width="10" height="12" rx="2" fill="#E2E8F0" stroke="#475569" stroke-width="1.2" transform="rotate(-8 67 92)" />
    <path d="M 64 98 L 60 115 L 70 115 L 66 98 Z" fill="#F59E0B" stroke="#B45309" stroke-width="1" />
    <circle cx="65" cy="110" r="2" fill="#FFFFFF" />
  </g>
</svg>
