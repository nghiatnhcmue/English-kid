<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="sharpBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" stop-opacity="0.4" />
    </radialGradient>
    <linearGradient id="sharpBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="sharpShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity="0.2" flood-color="#064E3B" />
    </filter>
  </defs>

  <circle cx="100" cy="100" r="94" fill="url(#sharpBg)" />

  <!-- Wooden pencil shavings curly ribbon -->
  <path d="M 125 75 Q 155 60 160 85 Q 165 110 140 105 Q 120 100 135 125" fill="none" stroke="#FDBA74" stroke-width="7" stroke-linecap="round" />
  <path d="M 125 75 Q 155 60 160 85 Q 165 110 140 105 Q 120 100 135 125" fill="none" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round" />

  <!-- Main Sharpener Block -->
  <g filter="url(#sharpShadow)">
    <!-- 3D Wedge Body -->
    <!-- Front Face with pencil hole -->
    <path d="M 45 130 L 75 160 L 125 140 L 95 110 Z" fill="#047857" stroke="#064E3B" stroke-width="1.5" />
    <!-- Round Pencil insertion hole -->
    <ellipse cx="85" cy="135" rx="14" ry="9" fill="#064E3B" transform="rotate(-15 85 135)" />
    <ellipse cx="85" cy="135" rx="11" ry="7" fill="#022C22" transform="rotate(-15 85 135)" />

    <!-- Slanted Top Face where blade sits -->
    <path d="M 45 130 L 95 110 L 145 50 L 95 70 Z" fill="url(#sharpBody)" stroke="#064E3B" stroke-width="1.5" />

    <!-- Right Side Face -->
    <path d="M 95 110 L 125 140 L 175 80 L 145 50 Z" fill="#10B981" stroke="#064E3B" stroke-width="1.5" />
    <!-- Grip indentations on side -->
    <line x1="120" y1="120" x2="148" y2="85" stroke="#047857" stroke-width="2" stroke-linecap="round" />
    <line x1="128" y1="128" x2="156" y2="93" stroke="#047857" stroke-width="2" stroke-linecap="round" />

    <!-- Metal Steel Blade -->
    <path d="M 75 105 L 85 101 L 132 45 L 122 49 Z" fill="url(#bladeGrad)" stroke="#475569" stroke-width="1.2" />
    <!-- Blade cutting edge highlight -->
    <line x1="75" y1="105" x2="122" y2="49" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Tiny center screw holding blade -->
    <circle cx="102" cy="76" r="3.5" fill="#E2E8F0" stroke="#475569" stroke-width="1" />
    <line x1="100" y1="74" x2="104" y2="78" stroke="#334155" stroke-width="1" />
  </g>
</svg>